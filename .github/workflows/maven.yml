name: CI Backend Maven

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercadito_test
          POSTGRES_USER: merca
          POSTGRES_PASSWORD: merca
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U merca -d mercadito_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install netcat
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if nc -z localhost 5432; then
              echo "Postgres is up!"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Build & test with Maven
        working-directory: ./backend
        run: ./mvnw -B clean verify -Dspring.profiles.active=test

