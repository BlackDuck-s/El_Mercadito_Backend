name: CI Backend Maven

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercadito
          POSTGRES_USER: merca
          POSTGRES_PASSWORD: merca
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U merca -d mercadito"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install PostgreSQL client (for pg_isready)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..20}; do
            if pg_isready -h localhost -p 5432 -U merca -d mercadito > /dev/null 2>&1; then
              echo "Postgres is up!"; exit 0;
            fi
            echo "Waiting for Postgres... ($i/20)";
            sleep 3;
          done
          echo "Postgres did not start in time"; exit 1;
        env:
          PGPASSWORD: merca

      - name: Build & test with Maven
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mercadito
          SPRING_DATASOURCE_USERNAME: merca
          SPRING_DATASOURCE_PASSWORD: merca
        run: ./mvnw -B clean verify
