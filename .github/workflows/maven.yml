name: CI Backend Maven

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: mercadito
          POSTGRES_USER: merca
          POSTGRES_PASSWORD: merca
        ports:
          - 5432:5432
        # Esperar a que la DB esté lista
        options: >-
          --health-cmd="pg_isready -U merca -d mercadito"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U merca >/dev/null 2>&1; then
              echo "Postgres is up!"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      # Muy importante: ejecutar todo dentro de /backend
      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Maven tests (clean verify)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mercadito
          SPRING_DATASOURCE_USERNAME: merca
          SPRING_DATASOURCE_PASSWORD: merca
        run: ./mvnw -B clean verify
