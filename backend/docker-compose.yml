services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercadito_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mercadito_dev
      SPRING_DATASOURCE_USERNAME: merca
      SPRING_DATASOURCE_PASSWORD: merca
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: mercadito_db
    environment:
      POSTGRES_DB: mercadito_dev
      POSTGRES_USER: merca
      POSTGRES_PASSWORD: merca
    ports:
      - "5000:5000"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merca -d mercadito_dev"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata: