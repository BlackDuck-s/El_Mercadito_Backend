services:
  db:
    image: postgres:16
    container_name: mercadito_db
    environment:
      POSTGRES_DB: mercadito_dev
      POSTGRES_USER: merca
      POSTGRES_PASSWORD: merca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merca -d mercadito_dev"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  pgdata:
